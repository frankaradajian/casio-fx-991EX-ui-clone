                <!-- No alpha label for this one -->

            <button class="btn shift-toggle-power" data-power="**2" data-shift-power="**3" onclick="handlePowerToggle()"> <!-- x^2 Square Button -->

            <button class="btn shift-toggle-exponent" data-power="**" data-shift-root="**(1/" onclick="handleExponentToggle()"> <!-- x^□ Exponent Button -->

            </button>
            <button class="btn shift-toggle-log" data-log="log10(" data-shift-power10="10**" onclick="handleLogToggle()">

            </button>

            <button class="btn shift-toggle-ln" data-ln="ln(" data-shift-exp="Math.E**" onclick="handleLnToggle()"> <!-- ln Button -->

                    <span class="shift-text-label">Rnd</span>

            </button>
            <button class="btn btn-numeric" data-value="."> <!-- Decimal button styled as numeric -->

                    <span class="shift-text-label">Ran#</span>
                    <span class="alpha-text-label">RanInt</span>
                </div>

            <button class="btn shift-toggle-sci" onclick="handleSciToggle()"> <!-- x10^x button styled as numeric for color -->

                    <span class="shift-text-label">π</span>
                    <span class="alpha-text-label"><i>e</i></span>
                </div>

<script>  // FUNCTIONS SCRIPTS START HERE  
let memorySlot = null;
let display = document.getElementById('display');
let buttons = document.querySelectorAll('.btn');
let shiftMode = false;
let lastAnswer = '';

buttons.forEach(button => {
  button.addEventListener('click', () => {
    const value = button.getAttribute('data-value');

    if (!value) return; 

    if (value === 'C') {
      display.value = '';
    } else if (value === '=') {
      try {
        // Replace symbolic root functions with JavaScript equivalents
        let expression = display.value
          .replace(/(?<!\.)\bsqrt\(/g, 'Math.sqrt(')
          .replace(/(?<!\.)\bcbrt\(/g, 'Math.cbrt(')
          .replace(/(?<!\.)\blog10\(/g, 'Math.log10(')
          .replace(/(?<!\.)\bln\(/g, 'Math.log(');
        
        let result = eval(expression);  
        display.value = eval(expression);
        lastAnswer = result; 
      } catch {
        display.value = 'Error';
     }
    }else { display.value += value;
    } 
  });
});
</script>

<script>
  // Function: toggleShift logics  
function toggleShift() {
  shiftMode = !shiftMode;
  console.log("Shift mode:", shiftMode);

  // Optional: visually highlight shift mode
  const shiftButton = document.querySelector('.shift-btn-main');
  if (shiftMode) {
    shiftButton.classList.add('active-shift');
  } else {
    shiftButton.classList.remove('active-shift');
  }
}
</script>

<script>
  // Function: Squared root (√x)    
function handleRootToggle() {
  const display = document.getElementById('display');
  const rootButton = document.querySelector('.shift-toggle-root');

  const value = shiftMode
    ? rootButton.getAttribute('data-shift-root')
    : rootButton.getAttribute('data-root');

  display.value += value;

  // Reset shift mode
  shiftMode = false;
  document.querySelector('.shift-btn-main').classList.remove('active-shift');
}  
</script>

    : powerButton.getAttribute('data-power');

<script>

<script>
    // Function: Additive Inverse (-x)
function toggleNegate(event) {
  if (event) event.preventDefault();

  const display = document.getElementById('display');
  let expr = display.value.trim();

  if (!expr) return;

  let lastChunk = '';
  let rest = '';

  // Case: ends with a bracketed group
  if (expr.endsWith(')')) {
    let depth = 0;
    for (let i = expr.length - 1; i >= 0; i--) {
      if (expr[i] === ')') depth++;
      if (expr[i] === '(') depth--;
      if (depth === 0) {
        lastChunk = expr.slice(i);
        rest = expr.slice(0, i);
        break;
      }
    }
  }

  // Fallback: single number or variable
  if (!lastChunk) {
  // If the entire expression is a number or already a result
  if (/^-?\d+(\.\d+)?$/.test(expr)) {
    lastChunk = expr;
    rest = '';
  } else {
    const match = expr.match(/(.+?)([0-9.]+|\w+)$/);
    if (match) {
      rest = match[1];
      lastChunk = match[2];
    } else {
      lastChunk = expr;
      rest = '';
    }
  }
}

  if (!lastChunk) return;

  // Toggle negation
  if (lastChunk.startsWith('-(') && lastChunk.endsWith(')')) {
    lastChunk = lastChunk.slice(2, -1);
  } else {
    lastChunk = `-(${lastChunk})`;
  }

  display.value = rest + lastChunk;
}
</script>
 
<script>
    // Function: Multiplicative Inverse (x⁻¹)
function calculateInverse(event) {
  if (event) event.preventDefault();

  const display = document.getElementById('display');
  const value = parseFloat(display.value);

  if (isNaN(value)) {
    alert("Please enter a valid number.");
    return;
  }

  if (value === 0) {
    alert("Error: Division by zero.");
    return;
  }

  display.value = 1 / value;
}
</script>

<script>
    // Function: STORE/RECALL (STO/RECALL)
function handleStoOrRecall(event) {
  if (event) event.preventDefault();

  const display = document.getElementById('display');

  if (shiftMode) {
    // RCL behavior
    if (memorySlot === null) {
      alert("No value stored.");
      return;
    }
    display.value += memorySlot;
  } else {
    // STO behavior
    const value = parseFloat(display.value);
    if (isNaN(value)) {
      alert("Cannot store: display is not a valid number.");
      return;
    }
    memorySlot = value;
    alert(`Stored: ${value}`);
  }

  shiftMode = false; // Reset after use
  document.querySelector('.shift-btn-main').classList.remove('active-shift');
}
</script>

<script>
    // Function: SCI (Scientific Notation)
function handleSciToggle() {
  const display = document.getElementById('display');

  const value = shiftMode
    ? Math.PI.toString() // SHIFT → insert π as a number
    : '*10**';           // Default → scientific notation

  display.value += value;

  shiftMode = false;
  document.querySelector('.shift-btn-main').classList.remove('active-shift');
}
</script>

<script>
    // Function: ANS (LAST RESULT)
function handleAnsToggle() {
  const display = document.getElementById('display');
  const ansButton = document.querySelector('.shift-toggle-ans');

  const value = shiftMode
    ? ansButton.getAttribute('data-shift-percent') // SHIFT → %
    : lastAnswer.toString();                        // Default → ANS

  display.value += value;

  shiftMode = false;
  document.querySelector('.shift-btn-main').classList.remove('active-shift');
}

function insertAns() {
  const display = document.getElementById('display');
  if (lastAnswer !== '') {
    display.value += lastAnswer.toString();
  }
}
</script>
